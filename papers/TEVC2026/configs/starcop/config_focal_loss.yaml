# Focal Loss Configuration
# Focal Loss tackles class imbalance by down-weighting easy examples
# and focusing learning on hard negatives
#
# Parameters:
#   alpha (α): Class weight for positive class (default: 0.25)
#   gamma (γ): Focusing parameter, higher = more focus on hard examples (default: 2.0)
#
# Formula: FL(p_t) = -α(1-p_t)^γ * log(p_t)
#   where p_t = p if y=1 else 1-p
#
# Handles imbalance differently than BCE:
# - BCE: Static weighting via pos_weight
# - Focal: Dynamic weighting based on prediction confidence

experiment_name: "focal_loss"
seed: 42

resume_from_checkpoint: False

wandb:
  wandb_project: "STARCOP"
  wandb_entity: "phd-dk"
  images_logging: "wandb"

dataloader:
  batch_size: 32
  num_workers: 16

products_plot: ["rgb_aviris", "mag1c", "label", "pred", "differences"]
plot_samples: 8

dataset:
  # Input: mag1c + RGB (HyperSTARCOP configuration)
  input_products:
    ["mag1c", "TOA_AVIRIS_640nm", "TOA_AVIRIS_550nm", "TOA_AVIRIS_460nm"]
  output_products: ["labelbinary"]

  # mag1c weighting (HyperSTARCOP uses mag1c-weighted loss)
  use_weight_loss: True
  weight_loss: "weight_mag1c"

  # Training parameters
  training_size: [128, 128]
  training_size_overlap: [64, 64]
  weight_sampling: True

  # Same datasets as baseline for fair comparison
  root_folder: ${oc.env:STARCOP_DATA_ROOT,/home/s/Data/STARCOP}
  train_csv: "train_without_okapi.csv"
  val_csv: "okapi_fusion.csv"
  test_csv: "test.csv"

model:
  train: True
  test: False

  model_mode: "segmentation_output"
  model_type: "unet_semseg"
  semseg_backbone: "mobilenet_v2"

  num_classes: 1
  optimizer: "adam"

  # Hyperparameters (same as baseline)
  lr: 0.001
  lr_decay: 0.5
  lr_patience: 4

  # FOCAL LOSS
  # alpha: Weight for positive class (0.25 = down-weight positives vs negatives 1:3)
  # gamma: Focusing parameter (2.0 = standard, focuses on hard examples)
  loss: "focal"
  focal_alpha: 0.25
  focal_gamma: 2.0

  # Early stopping
  early_stopping_patience: 8

  # Model selection: F1 (balanced objective)
  selection_metric: val_f1score

training:
  accelerator: gpu
  devices: 1
  max_epochs: 15

  val_check_interval: 0.5
  train_log_every_n_steps: 10

hydra:
  job:
    chdir: True
    config:
      override_dirname:
        exclude_keys:
          - experiment_name
  run:
    dir: experiments/${experiment_name}/${now:%Y-%m-%d_%H-%M}
  sweep:
    dir: experiments
    subdir: ${hydra.job.override_dirname}/${now:%Y-%m-%d_%H-%M}
